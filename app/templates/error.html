<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something went wrong</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="frame">
  <main class="work" style="grid-column:1/-1;max-width:52ch">
    <h2 style="font-family:var(--serif);font-weight:500;font-size:31px;margin:0 0 12px">
      The app could not serve this page
    </h2>
    <p style="color:var(--muted)">
      Check <a href="/health" style="color:var(--amber)">/health</a> to see whether the
      database is reachable, then look at the logs for the most recent
      <code style="font-family:var(--mono);font-size:13px">error.unhandled</code> line.
    </p>
    <p style="margin-top:22px"><a href="/" style="color:var(--slate)">Back to the task list</a></p>
  </main>
</div>
</body>
</html>
